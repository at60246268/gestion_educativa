<mat-toolbar color="primary">
  <button mat-button class="brand" routerLink="/dashboard">
    <mat-icon>school</mat-icon>
    <span>Gestión Educativa</span>
  </button>

  <span class="spacer"></span>

  <nav class="nav-links">
    <a mat-button routerLink="/dashboard" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">
      <mat-icon>dashboard</mat-icon> Dashboard
    </a>

    @if (isAdminOrProfesor) {
      <a mat-button routerLink="/cursos" routerLinkActive="active-link">
        <mat-icon>menu_book</mat-icon> Cursos
      </a>
    }

    @if (isAdmin) {
      <a mat-button routerLink="/usuarios" routerLinkActive="active-link">
        <mat-icon>people</mat-icon> Usuarios
      </a>
    }
  </nav>

  <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Menú de usuario">
    <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <div class="user-info" mat-menu-item disabled>
      <p class="user-name">{{ authService.getCurrentUser()?.nombre }}</p>
      <p class="user-role">{{ authService.getCurrentUser()?.rol | titlecase }}</p>
    </div>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      Cerrar Sesión
    </button>
  </mat-menu>
</mat-toolbar>
