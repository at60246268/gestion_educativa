<div class="page-container">
  <div class="page-header">
    <h2><mat-icon>people</mat-icon> Gestión de Usuarios</h2>
    <button mat-raised-button color="primary" (click)="nuevo()">
      <mat-icon>person_add</mat-icon> Nuevo Usuario
    </button>
  </div>

  @if (loading) {
    <div class="loading">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  } @else {
    <mat-card>
      <table mat-table [dataSource]="usuarios" class="full-width">

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let u" [appHighlight]="'#e3f2fd'">{{ u.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Correo</th>
          <td mat-cell *matCellDef="let u">{{ u.email }}</td>
        </ng-container>

        <ng-container matColumnDef="rol">
          <th mat-header-cell *matHeaderCellDef>Rol</th>
          <td mat-cell *matCellDef="let u">
            <mat-chip class="chip-{{ u.rol }}">{{ u.rol | titlecase }}</mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="activo">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let u">
            <mat-icon [color]="u.activo ? 'primary' : 'warn'">
              {{ u.activo ? 'check_circle' : 'cancel' }}
            </mat-icon>
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let u">
            <button mat-icon-button color="primary" (click)="editar(u.id)" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="eliminar(u.id)" matTooltip="Eliminar">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="5" style="text-align:center; padding: 24px;">
            No hay usuarios registrados.
          </td>
        </tr>
      </table>
    </mat-card>
  }
</div>
