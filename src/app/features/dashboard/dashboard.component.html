<div class="dashboard-container">
  <div class="dashboard-header">
    <div>
      <h1>{{ greeting }}, {{ currentUser?.nombre }}!</h1>
      <p>{{ today | date:'EEEE, d \'de\' MMMM y' }}</p>
    </div>
    <span class="role-badge role-{{ currentUser?.rol }}">
      <mat-icon>badge</mat-icon>
      {{ currentUser?.rol | titlecase }}
    </span>
  </div>

  <div class="cards-grid">
    @for (item of menuItems; track item.label) {
      <mat-card class="menu-card" (click)="router.navigate([item.route])">
        <mat-card-content>
          <div class="card-icon" [style.background]="item.color + '20'">
            <mat-icon [style.color]="item.color">{{ item.icon }}</mat-icon>
          </div>
          <h3>{{ item.label }}</h3>
          <p>Gestionar {{ item.label | lowercase }}</p>
        </mat-card-content>
      </mat-card>
    }
  </div>
</div>
